name: Publish SICTACK Python SDK to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target (testpypi or pypi)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi
      confirm_publish:
        description: 'Type "CONFIRM_PUBLISH" to authorize PyPI release'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write # Required for OpenID Connect (OIDC) Trusted Publishing

jobs:
  build-and-verify:
    name: Build Reproducible Wheel & Verify Attestations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: |
          cd INTENTLOCK_SDK/sdk/python
          python -m build

      - name: Verify package metadata and checksums
        run: |
          twine check INTENTLOCK_SDK/sdk/python/dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: INTENTLOCK_SDK/sdk/python/dist/

  publish-pypi:
    name: Publish to PyPI via OIDC Trusted Publishing
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_publish == 'CONFIRM_PUBLISH'
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: https://pypi.org/p/sictack
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (OIDC Token Exchange)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          attestations: true
