[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlock"
version = "0.1.0"
description = "Developer-first security middleware for AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Divy Bhanushali"}]
license = {text = "MIT"}
keywords = ["AI", "security", "policy", "middleware", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]", "sqlalchemy>=2.0", "alembic"]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "httpx", "black", "isort", "mypy"]
all = ["intentlock[api,dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyrefly]
project-excludes = ["tests/**"]